name: full name getter
on: workflow_dispatch

jobs:
  first_job:
    runs-on: ubuntu_latest
    steps:
      - uses: actions/checkout@main
      - name: name_printer
        id: name_printer
        uses: ./.github/actions/first-action
        with:
          first_name: ahmed
          last_name: mohamed
      - name: print output
        run: echo "::debug::${{steps.name_printer.outputs.full_name}}"