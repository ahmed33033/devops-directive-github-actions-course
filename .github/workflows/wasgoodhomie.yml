name: matrix_workflow
on: 
  workflow_dispatch

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

jobs:
  escape_the_matrix:
    runs-on: ubuntu-latest
    outputs:
      a: ${{steps.just-doit.outputs.a}}
      b: ${{steps.just-doit.outputs.b}}
    steps:
      - name: first step yo
        id: just-doit
        run: |
          echo "a=[1,2,3]" >> "$GITHUB_OUTPUT"
          echo "b=[\"a\",\"b\",\"c\"]" >> "$GITHUB_OUTPUT"
  
  get_the_matrix:
    runs-on: ubuntu-latest
    needs: escape_the_matrix
    strategy:
      matrix:
        a: ${{fromJson(needs.escape_the_matrix.outputs.a)}}
        b: ${{fromJson(needs.escape_the_matrix.outputs.b)}}
    steps:
      - name: boom
        run: echo "a is ${{matrix.a}}" while b is ${{matrix.b}}"
    